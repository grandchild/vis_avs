[package]
name = "avs-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
argh = { version = "0", default-features = false, features = ["help"] }
avs-rs = { path = "../avs-rs" }
anyhow = "1"
inotify = { version = "0", default-features = false, features = [] }
minifb = "0"
png = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
linuxfb = "0"
